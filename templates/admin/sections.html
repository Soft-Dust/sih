{% extends "base.html" %}

{% block title %}Manage Sections{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>
                <i class="fas fa-users me-2"></i>
                Manage Sections
            </h1>
            <button class="btn btn-primary" onclick="showAddSectionModal()">
                <i class="fas fa-plus me-2"></i>Add Section
            </button>
        </div>
    </div>
</div>

<!-- Sections Table -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="sectionsTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Year Level</th>
                                <th>Students</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="sectionsTableBody">
                            <tr>
                                <td colspan="5" class="text-center">
                                    <i class="fas fa-spinner fa-spin"></i> Loading...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Section Modal -->
<div class="modal fade" id="addSectionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Section</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addSectionForm">
                    <div class="mb-3">
                        <label class="form-label">Section Name</label>
                        <input type="text" class="form-control" name="name" required placeholder="e.g., CSE-1, IT-2A">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <select class="form-select" name="department_id" id="departmentSelect">
                            <option value="">Select Department (Optional)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Year Level</label>
                        <select class="form-select" name="year_level">
                            <option value="">Select Year Level (Optional)</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="addSection()">Add Section</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Section Modal -->
<div class="modal fade" id="editSectionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Section</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editSectionForm">
                    <div class="mb-3">
                        <label class="form-label">Section Name</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <select class="form-select" name="department_id" id="editDepartmentSelect">
                            <option value="">Select Department (Optional)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Year Level</label>
                        <select class="form-select" name="year_level">
                            <option value="">Select Year Level (Optional)</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                    <input type="hidden" name="section_id" id="editSectionId">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="updateSection()">Update Section</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let departments = [];

    document.addEventListener('DOMContentLoaded', function() {
        loadDepartments();
        loadSections();
    });

    async function loadDepartments() {
        try {
            const response = await fetch('/api/departments');
            if (response.ok) {
                departments = await response.json();
                populateDepartmentSelects();
            }
        } catch (error) {
            console.error('Error loading departments:', error);
        }
    }

    function populateDepartmentSelects() {
        const selects = ['departmentSelect', 'editDepartmentSelect'];
        selects.forEach(selectId => {
            const select = document.getElementById(selectId);
            select.innerHTML = '<option value="">Select Department (Optional)</option>' +
                departments.map(d => `<option value="${d.id}">${d.name} (${d.code})</option>`).join('');
        });
    }

    async function loadSections() {
        try {
            const response = await fetch('/api/sections');
            const sections = await response.json();

            const tbody = document.getElementById('sectionsTableBody');
            if (sections.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No sections found</td></tr>';
                return;
            }

            tbody.innerHTML = sections.map(section => `
                <tr>
                    <td><strong>${section.name}</strong></td>
                    <td>${section.department_name || 'N/A'}</td>
                    <td>${section.year_level ? `Year ${section.year_level}` : 'N/A'}</td>
                    <td>${section.student_count || 0} students</td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1" onclick="editSection(${section.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteSection(${section.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

        } catch (error) {
            console.error('Error loading sections:', error);
            showAlert('Failed to load sections', 'danger');
        }
    }

    function showAddSectionModal() {
        const modal = new bootstrap.Modal(document.getElementById('addSectionModal'));
        modal.show();
    }

    async function addSection() {
        const form = document.getElementById('addSectionForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        // Convert empty strings to null for optional fields
        if (!data.department_id) data.department_id = null;
        if (!data.year_level) data.year_level = null;

        try {
            const response = await fetch('/api/sections', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showAlert('Section added successfully', 'success');
                bootstrap.Modal.getInstance(document.getElementById('addSectionModal')).hide();
                form.reset();
                loadSections();
            } else {
                const error = await response.json();
                showAlert(error.error || 'Failed to add section', 'danger');
            }
        } catch (error) {
            showAlert('Network error', 'danger');
        }
    }

    async function editSection(id) {
        try {
            // Get section data
            const response = await fetch('/api/sections');
            const sections = await response.json();
            const section = sections.find(s => s.id === id);

            if (!section) {
                showAlert('Section not found', 'danger');
                return;
            }

            // Populate form
            const form = document.getElementById('editSectionForm');
            form.name.value = section.name;
            form.department_id.value = section.department_id || '';
            form.year_level.value = section.year_level || '';
            document.getElementById('editSectionId').value = id;

            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('editSectionModal'));
            modal.show();

        } catch (error) {
            showAlert('Failed to load section data', 'danger');
        }
    }

    async function updateSection() {
        const form = document.getElementById('editSectionForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        const sectionId = data.section_id;
        delete data.section_id;

        // Convert empty strings to null
        if (!data.department_id) data.department_id = null;
        if (!data.year_level) data.year_level = null;

        try {
            const response = await fetch(`/api/sections/${sectionId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showAlert('Section updated successfully', 'success');
                bootstrap.Modal.getInstance(document.getElementById('editSectionModal')).hide();
                loadSections();
            } else {
                const error = await response.json();
                showAlert(error.error || 'Failed to update section', 'danger');
            }
        } catch (error) {
            showAlert('Network error', 'danger');
        }
    }

    function deleteSection(id) {
        confirmAction(
            'Are you sure you want to delete this section? This will also remove all associated students and subject instances.',
            async function() {
                try {
                    const response = await fetch(`/api/sections/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        showAlert('Section deleted successfully', 'success');
                        loadSections();
                    } else {
                        const error = await response.json();
                        showAlert(error.error || 'Failed to delete section', 'danger');
                    }
                } catch (error) {
                    showAlert('Network error', 'danger');
                }
            }
        );
    }
</script>
{% endblock %}
