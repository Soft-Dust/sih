{% extends "base.html" %}

{% block title %}Manage Teachers{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>
                <i class="fas fa-chalkboard-teacher me-2"></i>
                Manage Teachers
            </h1>
            <button class="btn btn-primary" onclick="showAddTeacherModal()">
                <i class="fas fa-plus me-2"></i>Add Teacher
            </button>
        </div>
    </div>
</div>

<!-- Teachers Table -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="teachersTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Max Periods/Day</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="teachersTableBody">
                            <tr>
                                <td colspan="6" class="text-center">
                                    <i class="fas fa-spinner fa-spin"></i> Loading...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Teacher Modal -->
<div class="modal fade" id="addTeacherModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Teacher</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addTeacherForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="full_name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" name="department">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Max Periods Per Day</label>
                        <input type="number" class="form-control" name="max_periods_per_day" value="6" min="1" max="10">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="addTeacher()">Add Teacher</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', loadTeachers);

    async function loadTeachers() {
        try {
            const response = await fetch('/api/teachers');
            const teachers = await response.json();

            const tbody = document.getElementById('teachersTableBody');
            if (teachers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No teachers found</td></tr>';
                return;
            }

            tbody.innerHTML = teachers.map(teacher => `
                <tr>
                    <td>${teacher.full_name}</td>
                    <td>${teacher.username}</td>
                    <td>${teacher.email || 'N/A'}</td>
                    <td>${teacher.department || 'N/A'}</td>
                    <td>${teacher.max_periods_per_day}</td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1" onclick="editTeacher(${teacher.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteTeacher(${teacher.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

        } catch (error) {
            console.error('Error loading teachers:', error);
            showAlert('Failed to load teachers', 'danger');
        }
    }

    function showAddTeacherModal() {
        const modal = new bootstrap.Modal(document.getElementById('addTeacherModal'));
        modal.show();
    }

    async function addTeacher() {
        const form = document.getElementById('addTeacherForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/api/teachers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showAlert('Teacher added successfully', 'success');
                bootstrap.Modal.getInstance(document.getElementById('addTeacherModal')).hide();
                form.reset();
                loadTeachers();
            } else {
                const error = await response.json();
                showAlert(error.error || 'Failed to add teacher', 'danger');
            }
        } catch (error) {
            showAlert('Network error', 'danger');
        }
    }

    function editTeacher(id) {
        showAlert('Edit functionality coming soon', 'info');
    }

    function deleteTeacher(id) {
        confirmAction(
            'Are you sure you want to delete this teacher?',
            async function() {
                try {
                    const response = await fetch(`/api/teachers/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        showAlert('Teacher deleted successfully', 'success');
                        loadTeachers();
                    } else {
                        showAlert('Failed to delete teacher', 'danger');
                    }
                } catch (error) {
                    showAlert('Network error', 'danger');
                }
            }
        );
    }
</script>
{% endblock %}
